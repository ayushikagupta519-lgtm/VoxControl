# Credentials come from environment variables - never commit passwords.
# DB_URL=jdbc:mysql://localhost:3306/touchless_db
# DB_USER=root
# DB_PASSWORD=ayushi@123

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/touchless_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}