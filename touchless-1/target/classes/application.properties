spring.application.name=voxcontrol
server.port=${PORT:8080}

# ---- Default database: H2 file (persists in ./data, no install needed) ----
# For MySQL run with:  --spring.profiles.active=mysql  (see application-mysql.properties)
spring.datasource.url=jdbc:h2:file:./data/voxcontrol
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Insert demo contacts/messages/reminders on first start (only when the DB is empty)
voxcontrol.seed-demo-data=true

# Return clear JSON errors instead of stack traces
server.error.include-message=always
server.error.include-stacktrace=never
